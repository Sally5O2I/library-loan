<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도서관 대출</title>
<style>
  :root { --ok: #15803d; --fail: #dc2626; --line: #d4d4d8; --bg: #f8fafc; --muted: #52525b; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; background: var(--bg); color: #18181b; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.5rem; margin: 8px 0 8px; }
  #status { font-size: .95rem; color: #71717a; margin-bottom: 16px; }
  section { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }
  label { display: block; font-size: .9rem; margin: 8px 0 4px; color: #3f3f46; }
  input { width: 100%; font-size: 1.05rem; padding: 10px; border: 1px solid var(--line); border-radius: 8px; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  button { flex: 1; font-size: 1.05rem; padding: 12px; border: 0; border-radius: 8px; color: #fff; background: #2563eb; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  button.alt { background: #7c3aed; }
  button.gray { background: #52525b; }

  /* 책 번호 선택 목록 (직접 입력도 가능) */
  .combo { position: relative; }
  .options { display: none; position: absolute; z-index: 10; left: 0; right: 0; top: 100%; margin: 4px 0 0; padding: 4px 0;
             list-style: none; background: #fff; border: 1px solid var(--line); border-radius: 8px;
             box-shadow: 0 6px 16px rgba(0,0,0,.12); max-height: 180px; overflow-y: auto; }
  .options.open { display: block; }
  .options li { padding: 10px 12px; font-size: 1.05rem; cursor: pointer; }
  .options li:hover, .options li.active { background: #eff6ff; }

  .msg { margin-top: 12px; min-height: 1.6em; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  .msg .big { font-size: 1.6rem; font-weight: 800; }
  .msg.ok .big { color: var(--ok); }
  .msg.fail .big { color: var(--fail); }
  .msg .reason { font-size: .95rem; color: var(--muted); }

  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 1rem; }
  th, td { border-bottom: 1px solid var(--line); padding: 8px 6px; text-align: left; }
  th { font-size: .9rem; color: var(--muted); font-weight: 600; }
  .empty { margin-top: 12px; color: #71717a; }
</style>
</head>
<body>
<main>
  <h1>📚 도서관 대출</h1>
  <div id="status">solution.py 불러오는 중… (처음엔 몇 초 걸립니다)</div>

  <section>
    <h2>대출 · 반납</h2>
    <label for="book">책 번호 (직접 입력하거나 목록에서 선택)</label>
    <div class="combo">
      <input id="book" class="book-input" placeholder="B001" autocomplete="off" autocapitalize="characters">
      <ul class="options"></ul>
    </div>
    <label for="name">이름</label>
    <input id="name" placeholder="김민수" autocomplete="off">
    <label for="day">며칠째</label>
    <input id="day" placeholder="1" inputmode="decimal" autocomplete="off">
    <div class="row">
      <button id="borrowBtn" disabled>대출</button>
      <button id="returnBtn" class="alt" disabled>반납</button>
    </div>
    <div id="msg" class="msg" role="status"></div>
  </section>

  <section>
    <h2>대출 목록</h2>
    <label for="query">이름 또는 책 번호</label>
    <div class="combo">
      <input id="query" class="book-input" placeholder="김민수 또는 B002" autocomplete="off">
      <ul class="options"></ul>
    </div>
    <div class="row">
      <button id="queryBtn" disabled>조회</button>
      <button id="allBtn" class="gray" disabled>전체 대출 보기</button>
    </div>
    <div id="loans"></div>
  </section>

  <section>
    <h2>초기화</h2>
    <div class="row"><button id="resetBtn" class="gray" disabled>처음 상태로 초기화</button></div>
    <div id="resetMsg" class="empty"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
  // 브라우저 안에서 Python(Pyodide)을 돌려 solution.py를 그대로 불러 씁니다.
  // 대출 규칙과 실패 이유는 모두 solution.py에 있고, 웹은 돌려받은 값을 보여주기만 합니다.
  const GLUE = `
import json, re
import solution
from solution import LibraryLoan

lib = LibraryLoan()   # 페이지가 열려 있는 동안 계속 유지되는 객체 하나

INT_SHAPE = re.compile(r"[+-]?\\d+")
FLOAT_SHAPE = re.compile(r"[+-]?(\\d+\\.\\d*|\\.\\d+)")

def parse_day(text):
    # 정수 모양 → int, 소수 모양 → float, 나머지는 문자열 그대로 (검사는 solution.py가 함)
    s = text.strip()
    if INT_SHAPE.fullmatch(s):
        return int(s)
    if FLOAT_SHAPE.fullmatch(s):
        return float(s)
    return text

def web_books():
    return json.dumps(list(solution.BOOKS))

def web_borrow(book, name, day):
    d = parse_day(day)
    ok = lib.borrow(book, name, d)
    reason = None if ok is True else lib.borrow_fail_reason(book, name, d)
    return json.dumps({"result": ok, "reason": reason}, ensure_ascii=False)

def web_return(book, name, day):
    d = parse_day(day)
    r = lib.return_book(book, name, d)
    reason = lib.return_fail_reason(book, name, d) if r == -1 else None
    return json.dumps({"result": r, "reason": reason}, ensure_ascii=False)

def web_loans_by_name(name):
    # 순서는 get_loans가 돌려준 그대로, 빌린 날만 get_all_loans에서 찾아 붙인다
    borrowed = {row[0]: row[2] for row in lib.get_all_loans()}
    rows = [(book, name, borrowed[book], due) for book, due in lib.get_loans(name)]
    return json.dumps(rows, ensure_ascii=False)

def web_loans_by_book(book):
    return json.dumps([row for row in lib.get_all_loans() if row[0] == book], ensure_ascii=False)

def web_all_loans():
    return json.dumps(lib.get_all_loans(), ensure_ascii=False)

def web_reset():
    lib.__init__()   # 같은 객체를 처음 상태로 되돌림
`;

  const $ = (id) => document.getElementById(id);
  let py, BOOKS = [];

  async function start() {
    try {
      const pyodide = await loadPyodide();
      const res = await fetch("solution.py", { cache: "no-store" });
      if (!res.ok) throw new Error("solution.py를 찾지 못했습니다 (" + res.status + ")");
      pyodide.FS.writeFile("solution.py", await res.text());
      pyodide.runPython(GLUE);
      py = (fn, ...args) => JSON.parse(pyodide.globals.get(fn)(...args) ?? "null");
      BOOKS = py("web_books");
      document.querySelectorAll(".combo").forEach(setupCombo);
      document.querySelectorAll("button").forEach((b) => (b.disabled = false));
      $("status").textContent = "준비 완료";
    } catch (e) {
      $("status").textContent = "불러오기 실패: " + e.message;
    }
  }

  // 책 번호 칸: 클릭하면 전체 목록이 열리고, 입력하면 맞는 것만 남는다. 직접 입력한 값도 그대로 쓴다.
  function setupCombo(combo) {
    const input = combo.querySelector("input");
    const list = combo.querySelector(".options");
    const render = () => {
      const q = input.value.trim().toUpperCase();
      const items = BOOKS.filter((b) => !q || b.includes(q));
      list.replaceChildren(...items.map((b) => {
        const li = document.createElement("li");
        li.textContent = b;
        li.addEventListener("mousedown", (e) => { e.preventDefault(); input.value = b; list.classList.remove("open"); });
        return li;
      }));
      list.classList.toggle("open", items.length > 0);
    };
    input.addEventListener("focus", render);
    input.addEventListener("click", render);
    input.addEventListener("input", render);
    input.addEventListener("blur", () => list.classList.remove("open"));
    input.addEventListener("keydown", (e) => { if (e.key === "Escape" || e.key === "Enter") list.classList.remove("open"); });
  }

  function show(text, ok, reason) {
    const m = $("msg");
    const big = document.createElement("span");
    big.className = "big"; big.textContent = text;
    m.replaceChildren(big);
    if (reason) {
      const small = document.createElement("span");
      small.className = "reason"; small.textContent = reason;
      m.append(small);
    }
    m.className = "msg " + (ok ? "ok" : "fail");
  }

  const form = () => [$("book").value, $("name").value, $("day").value];

  $("borrowBtn").onclick = () => {
    try {
      const { result, reason } = py("web_borrow", ...form());
      result === true ? show("대출 성공", true) : show("실패", false, reason);
    } catch (e) { show("실패", false, "오류: " + e.message); }
  };

  $("returnBtn").onclick = () => {
    try {
      const { result, reason } = py("web_return", ...form());
      result === -1 ? show("실패", false, reason) : show("반납 성공 · 연체 " + result + "일", true);
    } catch (e) { show("실패", false, "오류: " + e.message); }
  };

  function renderLoans(rows, emptyText) {
    const box = $("loans");
    if (!rows.length) { box.innerHTML = ""; const d = document.createElement("div"); d.className = "empty"; d.textContent = emptyText; box.append(d); return; }
    const table = document.createElement("table");
    table.innerHTML = "<thead><tr><th>책 번호</th><th>빌린 사람</th><th>대출 기간</th></tr></thead>";
    const tbody = document.createElement("tbody");
    for (const [book, name, from, due] of rows) {
      const tr = document.createElement("tr");
      for (const text of [book, name, from + "일째 ~ " + due + "일째까지"]) {
        const td = document.createElement("td"); td.textContent = text; tr.append(td);
      }
      tbody.append(tr);
    }
    table.append(tbody);
    box.replaceChildren(table);
  }

  $("queryBtn").onclick = () => {
    const q = $("query").value;
    try {
      if (BOOKS.includes(q.trim())) {
        renderLoans(py("web_loans_by_book", q.trim()), q.trim() + "은(는) 지금 대출 중이 아닙니다.");
      } else {
        renderLoans(py("web_loans_by_name", q), (q || "(빈 이름)") + " 님이 빌린 책이 없습니다.");
      }
    } catch (e) { renderLoans([], "조회 실패: " + e.message); }
  };

  $("allBtn").onclick = () => {
    try { renderLoans(py("web_all_loans"), "지금 대출 중인 책이 없습니다."); }
    catch (e) { renderLoans([], "조회 실패: " + e.message); }
  };

  $("resetBtn").onclick = () => {
    py("web_reset");
    $("msg").replaceChildren(); $("loans").replaceChildren();
    $("resetMsg").textContent = "처음 상태로 초기화했습니다.";
  };

  start();
</script>
</body>
</html>
