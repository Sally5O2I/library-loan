<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도서관 대출</title>
<style>
  :root { --ok: #15803d; --fail: #dc2626; --line: #d4d4d8; --bg: #f8fafc; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; background: var(--bg); color: #18181b; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.5rem; margin: 8px 0 8px; }
  #status { font-size: .95rem; color: #71717a; margin-bottom: 16px; }
  section { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }
  label { display: block; font-size: .9rem; margin: 8px 0 4px; color: #3f3f46; }
  input { width: 100%; font-size: 1.05rem; padding: 10px; border: 1px solid var(--line); border-radius: 8px; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  button { flex: 1; font-size: 1.05rem; padding: 12px; border: 0; border-radius: 8px; color: #fff; background: #2563eb; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  button.alt { background: #7c3aed; }
  button.reset { background: #52525b; }
  .msg { margin-top: 12px; font-size: 1.6rem; font-weight: 800; min-height: 1.6em; }
  .msg.ok { color: var(--ok); }
  .msg.fail { color: var(--fail); }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 1.05rem; }
  th, td { border-bottom: 1px solid var(--line); padding: 8px; text-align: left; }
  .empty { margin-top: 12px; color: #71717a; }
</style>
</head>
<body>
<main>
  <h1>📚 도서관 대출</h1>
  <div id="status">solution.py 불러오는 중… (처음엔 몇 초 걸립니다)</div>

  <section>
    <h2>대출 · 반납</h2>
    <label for="book">책 번호 (B001~B005)</label>
    <input id="book" placeholder="B001" autocapitalize="characters" autocomplete="off">
    <label for="name">이름</label>
    <input id="name" placeholder="김민수" autocomplete="off">
    <label for="day">며칠째</label>
    <input id="day" placeholder="1" inputmode="decimal" autocomplete="off">
    <div class="row">
      <button id="borrowBtn" disabled>대출</button>
      <button id="returnBtn" class="alt" disabled>반납</button>
    </div>
    <div id="msg" class="msg" role="status"></div>
  </section>

  <section>
    <h2>대출 목록</h2>
    <label for="loanName">이름</label>
    <input id="loanName" placeholder="김민수" autocomplete="off">
    <div class="row"><button id="loansBtn" disabled>목록 보기</button></div>
    <div id="loans"></div>
  </section>

  <section>
    <h2>초기화</h2>
    <div class="row"><button id="resetBtn" class="reset" disabled>처음 상태로 초기화</button></div>
    <div id="resetMsg" class="empty"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
  // 브라우저 안에서 Python(Pyodide)을 돌려 solution.py를 그대로 불러 씁니다.
  // 대출 규칙은 여기에 두지 않고, 성공/실패는 solution.py가 돌려준 값으로만 판단합니다.
  const GLUE = `
import json, re
from solution import LibraryLoan

lib = LibraryLoan()   # 페이지가 열려 있는 동안 계속 유지되는 객체 하나

INT_SHAPE = re.compile(r"[+-]?\\d+")
FLOAT_SHAPE = re.compile(r"[+-]?(\\d+\\.\\d*|\\.\\d+)")

def parse_day(text):
    # 정수 모양 → int, 소수 모양 → float, 나머지는 문자열 그대로 (검사는 solution.py가 함)
    s = text.strip()
    if INT_SHAPE.fullmatch(s):
        return int(s)
    if FLOAT_SHAPE.fullmatch(s):
        return float(s)
    return text

def web_borrow(book, name, day):
    return json.dumps(lib.borrow(book, name, parse_day(day)))

def web_return(book, name, day):
    return json.dumps(lib.return_book(book, name, parse_day(day)))

def web_loans(name):
    return json.dumps(lib.get_loans(name), ensure_ascii=False)

def web_reset():
    lib.__init__()   # 같은 객체를 처음 상태로 되돌림
`;

  const $ = (id) => document.getElementById(id);
  let py;

  async function start() {
    try {
      const pyodide = await loadPyodide();
      const res = await fetch("solution.py", { cache: "no-store" });
      if (!res.ok) throw new Error("solution.py를 찾지 못했습니다 (" + res.status + ")");
      pyodide.FS.writeFile("solution.py", await res.text());
      pyodide.runPython(GLUE);
      py = (fn, ...args) => JSON.parse(pyodide.globals.get(fn)(...args) ?? "null");
      document.querySelectorAll("button").forEach((b) => (b.disabled = false));
      $("status").textContent = "준비 완료";
    } catch (e) {
      $("status").textContent = "불러오기 실패: " + e.message;
    }
  }

  function show(text, ok) {
    $("msg").textContent = text;
    $("msg").className = "msg " + (ok ? "ok" : "fail");
  }

  const form = () => [$("book").value, $("name").value, $("day").value];

  $("borrowBtn").onclick = () => {
    try {
      py("web_borrow", ...form()) === true ? show("대출 성공", true) : show("실패", false);
    } catch (e) { show("실패 (오류: " + e.message + ")", false); }
  };

  $("returnBtn").onclick = () => {
    try {
      const r = py("web_return", ...form());
      r === -1 ? show("실패", false) : show("반납 성공 · 연체 " + r + "일", true);
    } catch (e) { show("실패 (오류: " + e.message + ")", false); }
  };

  $("loansBtn").onclick = () => {
    const box = $("loans");
    try {
      const rows = py("web_loans", $("loanName").value);
      if (!rows.length) { box.innerHTML = '<div class="empty">빌린 책이 없습니다.</div>'; return; }
      const table = document.createElement("table");
      table.innerHTML = "<thead><tr><th>책 번호</th><th>반납 기한</th></tr></thead>";
      const tbody = document.createElement("tbody");
      for (const [book, due] of rows) {
        const tr = document.createElement("tr");
        const a = document.createElement("td"); a.textContent = book;
        const b = document.createElement("td"); b.textContent = due + "일째까지";
        tr.append(a, b); tbody.append(tr);
      }
      table.append(tbody);
      box.replaceChildren(table);
    } catch (e) { box.innerHTML = '<div class="msg fail">실패</div>'; }
  };

  $("resetBtn").onclick = () => {
    py("web_reset");
    $("msg").textContent = ""; $("loans").replaceChildren();
    $("resetMsg").textContent = "처음 상태로 초기화했습니다.";
  };

  start();
</script>
</body>
</html>
